# XcodeGen spec. Generate the Xcode project with: xcodegen generate
name: MorningMonk
options:
  bundleIdPrefix: com.morningmonk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MorningMonk:
    type: application
    platform: iOS
    sources:
      - path: MorningMonk
    info:
      path: MorningMonk/Info.plist
      properties:
        CFBundleDisplayName: Morning Monk
        NSCameraUsageDescription: "Morning Monk watches your form to coach you. Your camera stays on your phone. Nothing is recorded or uploaded."
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morningmonk.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  MorningMonkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MorningMonkTests
    dependencies:
      - target: MorningMonk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MorningMonk:
    build:
      targets:
        MorningMonk: all
        MorningMonkTests: [test]
    test:
      targets:
        - MorningMonkTests
